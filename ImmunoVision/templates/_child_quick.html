{# Child Records quick panel: styles and behaviour, included by the RHU and BHW
   lists. Click a row (or press Enter on it) to open the child's panel under it. #}
<style>
.children-table tbody tr[data-child-id] { cursor: pointer; }
.children-table tbody tr[data-child-id]:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.qp-chev { display: inline-flex; width: 12px; margin-right: 8px; vertical-align: -1px; color: var(--text-secondary); transform: rotate(180deg); transition: transform .15s; }
tr.qp-open td { background: #f8fafc !important; }
tr.qp-open .qp-chev { transform: rotate(270deg); color: var(--text-primary); }
tr.qp-done td { background: #f6fef9 !important; transition: background .4s; }
tr.qp-row > td { background: #f8fafc !important; padding: 0 !important; border-bottom: 1px solid var(--border-strong) !important; cursor: default; }
.qp-holder { position: sticky; left: 0; box-sizing: border-box; padding: 14px 20px 16px 0; white-space: normal; }
.qp-loading { padding: 8px 0; color: var(--text-secondary); font-size: 13px; }
.qp { display: flex; flex-direction: column; gap: 14px; font-size: 12px; white-space: normal; }
.qp * { white-space: normal; }
.qp-doses { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-start; }
.qp-grp { display: flex; flex-direction: column; gap: 4px; }
.qp-gl { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-primary); display: flex; gap: 4px; align-items: center; min-height: 16px; white-space: nowrap !important; }
.qp-late-txt { color: var(--red); margin-left: 6px; }
.qp-gc { display: flex; gap: 3px; flex-wrap: wrap; }
.qp-c { box-sizing: border-box; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 5px 7px; border-radius: 8px; border: 1px solid var(--border-strong); background: #fff; font: inherit; font-size: 12px; color: var(--text-primary); text-align: left; white-space: nowrap !important; }
.qp-c em { font-style: normal; font-weight: 600; display: flex; align-items: center; gap: 5px; white-space: nowrap !important; }
.qp-c small { font-size: 10.5px; font-weight: 500; color: var(--text-secondary); white-space: nowrap !important; }
.qp-given { background: #eef2f6; border-color: transparent; cursor: pointer; }
.qp-given:hover { border-color: var(--border-strong); }
.qp-pick { cursor: pointer; background: #fff; }
.qp-pick input { width: 13px; height: 13px; margin: 0; accent-color: var(--primary); }
.qp-late small:first-of-type { color: var(--red); }
.qp-pick.qp-on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.qp-st { font-size: 10px !important; }
.qp-st0 { color: var(--red) !important; }
.qp-up, .qp-locked { background: transparent; border-color: var(--border); color: #9ca3af; font-weight: 500; cursor: not-allowed; }
.qp-up em, .qp-locked em { font-weight: 500; }
.qp-up small, .qp-locked small { color: #9ca3af; }
.qp-fix { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; }
.qp-fix[hidden] { display: none; }
.qp-fix input, .qp-drow input, .qp-in { box-sizing: border-box; height: 34px; padding: 0 9px; border: 1px solid var(--border-strong); border-radius: 8px; font: inherit; font-size: 13px; background: #fff; }
.qp-rec { display: flex; align-items: flex-start; gap: 24px; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
.qp-rec-what { flex: 1; min-width: 0; }
.qp-lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); margin: 0 0 6px; }
.qp-none { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
.qp-list { display: flex; gap: 6px; flex-wrap: wrap; }
.qp-list:empty { display: none; }
.qp-pill { font-weight: 600; font-size: 13px; color: var(--text-primary); }
.qp-help { font-size: 11.5px; color: var(--text-secondary); margin-top: 6px; }
.qp-help[hidden], .qp-msg[hidden], .qp-none[hidden] { display: none; }
.qp-msg { margin-top: 8px; font-size: 12px; line-height: 1.4; }
.qp-msg.err { color: var(--red); font-weight: 600; }
.qp-msg.warn { color: #92400e; }
.qp-rows { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
.qp-rows:empty { display: none; }
.qp-drow { display: grid; grid-template-columns: 170px 190px 1fr; align-items: center; gap: 12px; }
.qp-drow .qp-pill { justify-self: start; }
.qp-drow input { width: 100%; }
.qp-drow input.qp-bad { border-color: var(--red); }
.qp-dnote { font-size: 11.5px; color: var(--text-secondary); }
.qp-dnote.qp-changed { color: var(--text-primary); }
.qp-dnote.qp-bad { color: var(--red); font-weight: 600; }
.qp-btn { flex: none; align-self: center; height: 40px; padding: 0 20px; font-size: 13.5px; font-weight: 600; border-radius: 8px; }
.qp-btn:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; border: 0; }
.qp-btn:not(:disabled) { background: var(--primary); color: #fff; border: 0; }
.qp-foot { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--text-secondary); font-size: 12.5px; }
.qp-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.qp-info-view { display: inline-flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.qp-info-view b { color: var(--text-primary); font-weight: 600; }
.qp-info-form { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.qp-info-form[hidden], .qp-info-view[hidden] { display: none; }
.qp-in { width: 150px; height: 30px; font-size: 12.5px; }
.qp-in-wide { width: 190px; }
.qp-link { border: 0; background: none; padding: 0; font: inherit; color: var(--primary); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.qp-foot > .qp-link { margin-left: auto; }
.qp-hint { color: var(--text-secondary); font-size: 13px; margin: -4px 0 10px; }
.qc-box { max-width: 520px; }
.qc-box .modal-head h3 { margin: 0; font-size: 17px; }
.qc-who { display: flex; align-items: baseline; gap: 10px; padding: 0 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.qc-who b { font-size: 15px; } .qc-who span { color: var(--text-secondary); font-size: 12.5px; }
.qc-sec { margin-bottom: 14px; }
.qc-lbl { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
.qc-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.qc-list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; font-size: 13.5px; border-top: 1px solid var(--border); }
.qc-list li:first-child { border-top: 0; }
.qc-list li small { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.qc-list li small.late { color: var(--red); font-weight: 600; }
.qc-big { font-size: 16px; font-weight: 700; }
.qc-chg { margin-left: 6px; font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.qc-note { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; margin: 0; }
.qc-warn { font-size: 12.5px; line-height: 1.45; color: #92400e; margin: 0 0 12px; }
.qc-arrow { color: var(--text-secondary); margin: 0 5px; font-weight: 400; }
.qc-box .modal-footer .btn { min-width: 110px; justify-content: center; }
.qp-toast { position: fixed; right: 28px; bottom: 24px; z-index: 60; max-width: 440px; background: #111827; color: #fff; border-radius: 12px; padding: 12px 16px; font-size: 13px; box-shadow: 0 12px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 6px; }
.qp-toast .row1 { display: flex; gap: 14px; align-items: flex-start; }
.qp-toast .row2 { color: #cbd5e1; font-size: 12.5px; line-height: 1.45; }
.qp-toast .row2 b { color: #fff; }
.qp-toast button { margin-left: auto; border: 0; background: none; color: #93c5fd; font: inherit; font-weight: 700; cursor: pointer; padding: 0; }
@media (max-width: 760px) {
  .qp-holder { padding: 12px 12px 14px 12px !important; }
  .qp-rec { flex-direction: column; gap: 12px; }
  .qp-drow { grid-template-columns: 1fr; gap: 4px; }
  .qp-btn { width: 100%; align-self: stretch; }
  .qp-foot > .qp-link { margin-left: 0; }
  .qp-toast { left: 12px; right: 12px; max-width: none; }
}
</style>

<script>
(function () {
  const table = document.querySelector('table.children-table');
  if (!table) return;
  const base = table.dataset.quickBase;            // e.g. /bhw/children/0
  const url = (id, action) => base.replace(/\/0$/, '/' + id) + '/' + action;
  const today = table.dataset.today;
  const fmt = iso => { const [y, m, d] = iso.split('-'); return m + '/' + d + '/' + y.slice(2); };
  const store = {
    get() { try { return sessionStorage.getItem('qpDate'); } catch (e) { return null; } },
    set(v) { try { v ? sessionStorage.setItem('qpDate', v) : sessionStorage.removeItem('qpDate'); } catch (e) {} }
  };
  let openRow = null;

  // Centered confirmation: shows a summary of the update, Cancel or Confirm.
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim';
  scrim.setAttribute('role', 'dialog');
  scrim.setAttribute('aria-modal', 'true');
  scrim.innerHTML = `<div class="modal-box qc-box"><div class="modal-head"><h3 class="qc-title"></h3>
      <button type="button" class="modal-close qc-x" aria-label="Cancel">×</button></div>
    <div class="modal-body qc-body"></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline qc-cancel">Cancel</button>
      <button type="button" class="btn btn-primary qc-ok">Confirm</button></div></div>`;
  document.body.appendChild(scrim);
  let settle = null;
  function askConfirm(title, html, okText) {
    scrim.querySelector('.qc-title').textContent = title;
    scrim.querySelector('.qc-body').innerHTML = html;
    scrim.querySelector('.qc-ok').textContent = okText || 'Confirm';
    scrim.classList.add('open');
    setTimeout(() => scrim.querySelector('.qc-ok').focus(), 30);
    return new Promise(res => { settle = res; });
  }
  function closeConfirm(answer) {
    if (!settle) return;
    scrim.classList.remove('open');
    const s = settle; settle = null; s(answer);
  }
  scrim.querySelector('.qc-ok').addEventListener('click', () => closeConfirm(true));
  scrim.querySelector('.qc-cancel').addEventListener('click', () => closeConfirm(false));
  scrim.querySelector('.qc-x').addEventListener('click', () => closeConfirm(false));
  scrim.addEventListener('click', e => { if (e.target === scrim) closeConfirm(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && settle) closeConfirm(false); });
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function whoHtml(tr) {
    const name = tr.querySelector('.child-name-link'), chip = tr.querySelector('.id-chip');
    const dob = tr.cells[3] ? tr.cells[3].textContent.trim() : '';
    return `<div class="qc-who"><b>${esc(name ? name.textContent.trim() : '')}</b><span>${esc(chip ? chip.textContent.trim() : '')}, born ${esc(dob)}</span></div>`;
  }
  const longDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });

  function rows() { return [...table.querySelectorAll('tbody tr[data-child-id]')]; }

  function closePanel() {
    if (!openRow) return;
    openRow.classList.remove('qp-open');
    openRow.setAttribute('aria-expanded', 'false');
    const next = openRow.nextElementSibling;
    if (next && next.classList.contains('qp-row')) next.remove();
    openRow = null;
  }

  async function openPanel(tr, focusPanel) {
    if (openRow === tr) { closePanel(); return; }
    closePanel();
    openRow = tr;
    tr.classList.add('qp-open');
    tr.setAttribute('aria-expanded', 'true');
    const row = document.createElement('tr');
    row.className = 'qp-row';
    row.innerHTML = `<td colspan="${tr.cells.length}"><div class="qp-holder"><div class="qp-loading">Loading…</div></div></td>`;
    tr.after(row);
    const holder = row.querySelector('.qp-holder');
    sizeHolder(tr, holder);
    try {
      const res = await fetch(url(tr.dataset.childId, 'panel'), { headers: { 'X-Requested-With': 'fetch' } });
      if (!res.ok) throw new Error();
      holder.innerHTML = await res.text();
      initPanel(tr, holder.querySelector('.qp'));
      if (focusPanel) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } catch (e) {
      holder.innerHTML = '<div class="qp-loading">Could not load this child. Please try again.</div>';
    }
  }

  function sizeHolder(tr, holder) {  // line the panel up with the ID text and the visible table width
    const wrap = table.closest('.table-wrap') || table.parentElement;
    const chip = tr.querySelector('.id-chip');
    const left = chip ? chip.getBoundingClientRect().left - tr.getBoundingClientRect().left : 16;
    holder.style.paddingLeft = Math.max(12, left) + 'px';
    holder.style.width = wrap.clientWidth + 'px';
  }

  function post(action, id, data) {
    const fd = new FormData();
    Object.entries(data).forEach(([k, v]) => [].concat(v).forEach(x => fd.append(k, x)));
    return fetch(url(id, action), { method: 'POST', body: fd, headers: { 'X-Requested-With': 'fetch' } })
      .then(r => r.json().catch(() => ({ ok: false, error: 'Something went wrong. Please try again.' })));
  }

  function updateRow(tr, state) {
    const sum = tr.querySelector('td.dose-summary');
    if (sum) {
      const b = sum.querySelector('b'); if (b) b.textContent = state.done;
      const fill = sum.querySelector('.progress-fill');
      if (fill) {
        fill.style.width = Math.round(state.done / state.total * 100) + '%';
        fill.classList.remove('green', 'amber', 'red');
        fill.classList.add(state.done === state.total ? 'green' : (state.done >= state.total * 0.75 ? 'amber' : 'red'));
      }
    }
    Object.entries(state.dates || {}).forEach(([code, d]) => {
      const cell = tr.querySelector(`td[data-code="${code}"]`);
      if (!cell) return;
      const bhw = cell.classList.contains('dose-check-cell');
      cell.classList.toggle(bhw ? 'dose-given' : 'cell-green', !!d);
      cell.classList.toggle(bhw ? 'dose-not-given' : 'cell-muted', !d);
      if (bhw) { const s = cell.querySelector('span'); if (s) { s.textContent = d ? '✓' : '—'; s.title = d ? d : 'No vaccination record'; } }
      else cell.textContent = d || '—';
    });
    const badge = tr.querySelector('.badge');
    if (badge && state.risk) {
      badge.textContent = state.risk;
      badge.className = 'badge ' + (state.risk === 'At-Risk' ? 'badge-red' : 'badge-green');
    }
  }

  let toastTimer = null;
  function toast(html, undo) {
    document.querySelectorAll('.qp-toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'qp-toast';
    t.setAttribute('role', 'status');
    t.innerHTML = html;
    if (undo) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = 'Undo';
      b.addEventListener('click', () => { t.remove(); undo(); });
      t.querySelector('.row1').appendChild(b);
    }
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), 12000);
  }

  function initPanel(tr, panel) {
    const id = tr.dataset.childId;
    const boxes = [...panel.querySelectorAll('.qp-cb')];
    const rec = panel.querySelector('.qp-rec');
    const rowsBox = panel.querySelector('.qp-rows');
    const none = panel.querySelector('.qp-none');
    const helpEmpty = panel.querySelector('.qp-help-empty');
    const helpSome = panel.querySelector('.qp-help-some');
    const msg = panel.querySelector('.qp-msg');
    const btn = panel.querySelector('.qp-btn');
    const dobMin = rec.dataset.dob;
    const dateRows = {};  // dose code -> its row (kept while the dose stays selected)

    function defaultDate(b) {
      const remembered = store.get();
      const d = remembered && remembered <= today && remembered >= dobMin ? remembered : today;
      return d > b.dataset.latest ? b.dataset.latest : d;
    }
    function dateRow(b) {
      if (dateRows[b.value]) return dateRows[b.value];
      const row = document.createElement('div');
      row.className = 'qp-drow';
      const inputId = `qp-d-${id}-${b.value}`;
      row.innerHTML = `<label class="qp-pill ${b.closest('.qp-late') ? 'late' : 'due'}" for="${inputId}">${b.dataset.short}</label>` +
        `<input type="date" id="${inputId}" aria-label="Date ${b.dataset.short} was given" max="${b.dataset.latest}" min="${b.dataset.earliest > dobMin ? b.dataset.earliest : dobMin}" value="${defaultDate(b)}">` +
        `<span class="qp-dnote"></span>`;
      row.querySelector('input').addEventListener('change', e => {
        store.set(e.target.value && e.target.value !== today ? e.target.value : null);
        refresh();
      });
      return (dateRows[b.value] = row);
    }

    function showMsg(text, kind) { msg.hidden = !text; msg.className = 'qp-msg ' + (kind || ''); msg.textContent = text || ''; }

    function refresh() {
      const picked = boxes.filter(b => b.checked);
      boxes.forEach(b => b.closest('.qp-pick').classList.toggle('qp-on', b.checked));
      Object.keys(dateRows).forEach(code => { if (!picked.some(b => b.value === code)) { dateRows[code].remove(); delete dateRows[code]; } });
      picked.forEach(b => rowsBox.appendChild(dateRow(b)));  // keeps schedule order
      none.hidden = picked.length > 0;
      helpEmpty.hidden = picked.length > 0;
      helpSome.hidden = picked.length === 0;
      rec.classList.toggle('qp-empty', picked.length === 0);
      const problems = [];
      picked.forEach(b => {
        const input = dateRows[b.value].querySelector('input'), note = dateRows[b.value].querySelector('.qp-dnote');
        let bad = '';
        if (!input.value) bad = 'Enter the date given';
        else if (input.value > today) bad = 'Cannot be after today';
        else if (input.value < b.dataset.earliest) bad = `Not before ${fmt(b.dataset.earliest)}`;
        else if (input.value > b.dataset.latest) bad = `Not after ${fmt(b.dataset.latest)}`;
        const changed = !bad && input.value !== today;
        input.classList.toggle('qp-bad', !!bad);
        input.classList.toggle('qp-changed', changed);
        note.className = 'qp-dnote' + (bad ? ' qp-bad' : (changed ? ' qp-changed' : ''));
        note.textContent = bad || (changed ? 'Not today. Check the child\'s card.' : 'Today');
        if (bad) problems.push(b.value);
      });
      const noStock = picked.filter(b => b.closest('.qp-pick').querySelector('.qp-st0')).map(b => b.dataset.short);
      if (problems.length) showMsg('Fix the date marked in red. Doses must follow the schedule and cannot be dated after today.', 'err');
      else if (noStock.length) showMsg(`No stock for ${noStock.join(', ')} in your barangay. It will be saved and flagged as recorded with no stock; request a transfer from the RHU.`, 'warn');
      else showMsg('');
      btn.disabled = picked.length === 0 || problems.length > 0;
      btn.textContent = picked.length === 0 ? 'Select a dose first'
        : `Record ${picked.length} dose${picked.length === 1 ? '' : 's'}`;
    }

    boxes.forEach(b => b.addEventListener('change', refresh));
    const dateOf = b => dateRows[b.value].querySelector('input').value;

    btn.addEventListener('click', async () => {
      const codes = boxes.filter(b => b.checked).map(b => b.value);
      if (!codes.length || btn.disabled) return;
      const picked = boxes.filter(b => b.checked);
      const items = picked.map(b => {
        const late = +b.dataset.late, d = dateOf(b);
        return `<li><span>${esc(b.dataset.name)}<br><small class="${late ? 'late' : ''}">${late ? `overdue ${late} days` : `due ${b.dataset.due}`}</small></span>` +
          `<b style="white-space:nowrap">${longDate(d)}${d !== today ? '<span class="qc-chg">(not today)</span>' : ''}</b></li>`;
      }).join('');
      const changed = picked.some(b => dateOf(b) !== today);
      const stocked = picked.filter(b => b.dataset.stock !== '');
      const empty = stocked.filter(b => +b.dataset.stock <= 0).map(b => b.dataset.short);
      const used = stocked.filter(b => +b.dataset.stock > 0).map(b => `${b.dataset.short} (${b.dataset.stock} left, ${+b.dataset.stock - 1} after)`);
      const html = whoHtml(tr) +
        `<div class="qc-sec"><div class="qc-lbl">Doses to record (${picked.length}) and date given</div><ul class="qc-list">${items}</ul></div>` +
        (changed ? `<div class="qc-warn">A date is not today. Make sure it matches the date written on the child's card.</div>` : '') +
        (empty.length ? `<div class="qc-warn">No stock for ${esc(empty.join(', '))}. ${empty.length === 1 ? 'It' : 'They'} will be saved and flagged as recorded with no stock.</div>` : '') +
        (used.length ? `<div class="qc-sec"><div class="qc-lbl">Barangay stock</div><p class="qc-note">1 dose each will be taken: ${esc(used.join(', '))}.</p></div>` : '') +
        `<p class="qc-note">The child's risk is re-assessed after saving. You can undo right after.</p>`;
      if (!await askConfirm('Confirm recording', html, `Confirm, record ${picked.length} dose${picked.length === 1 ? '' : 's'}`)) return;
      btn.disabled = true; btn.textContent = 'Saving…';
      const payload = { codes };
      picked.forEach(b => { payload['date_' + b.value] = dateOf(b); });
      const r = await post('quick-record', id, payload);
      if (!r.ok) { showMsg(r.error, 'err'); btn.disabled = false; btn.textContent = `Record ${codes.length} dose${codes.length === 1 ? '' : 's'}`; return; }
      updateRow(tr, r.row);
      tr.classList.add('qp-done');
      const parts = [];
      if (r.still_needed.length) parts.push(`Can still be given today: <b>${r.still_needed.join(', ')}</b>`);
      if (r.next_visit) parts.push(`Next: <b>${r.next_visit.doses.join(', ')}</b> from ${r.next_visit.date}`);
      toast(`<div class="row1"><span><b>${r.child}</b>: ${r.recorded.join(', ')} recorded. Now <b>${r.risk}</b>.</span></div>` +
            (parts.length ? `<div class="row2">${parts.join('<br>')}</div>` : ''),
            async () => {
              const undo = { codes: r.codes };
              Object.entries(r.dates).forEach(([c, d]) => { undo['date_' + c] = d; });
              const u = await post('quick-undo', id, undo);
              if (u.ok) { updateRow(tr, u.row); tr.classList.remove('qp-done'); toast(`<div class="row1"><span>Undone: ${r.recorded.join(', ')} removed for <b>${r.child}</b></span></div>`); if (openRow === tr) { closePanel(); openPanel(tr); } }
              else toast(`<div class="row1"><span>${u.error}</span></div>`);
            });
      const all = rows();
      const next = all[all.indexOf(tr) + 1];
      closePanel();
      if (next) openPanel(next, true);
    });

    // correct the date of a dose already given
    const fix = panel.querySelector('.qp-fix');
    const fixDate = fix.querySelector('.qp-fix-date');
    let fixCode = null;
    panel.querySelectorAll('.qp-given').forEach(c => c.addEventListener('click', () => {
      fixCode = c.dataset.fix;
      fix.querySelector('.qp-fix-name').textContent = c.querySelector('em').textContent.trim();
      fixDate.value = c.dataset.date;
      fixDate.min = dobMin;
      fix.hidden = false;
      fix.querySelectorAll('.qp-msg').forEach(m => m.remove());
      fixDate.focus();
    }));
    fix.querySelector('.qp-fix-cancel').addEventListener('click', () => { fix.hidden = true; });
    fix.querySelector('.qp-fix-save').addEventListener('click', async () => {
      const chip = panel.querySelector(`.qp-given[data-fix="${fixCode}"]`);
      if (!fixDate.value || fixDate.value === chip.dataset.date) { fix.hidden = true; return; }
      const html = whoHtml(tr) +
        `<div class="qc-sec"><div class="qc-lbl">Correct a recorded date</div><ul class="qc-list"><li><span>${esc(chip.dataset.name)}</span>` +
        `<small><s>${longDate(chip.dataset.date)}</s><span class="qc-arrow">to</span><b style="color:var(--text-primary)">${longDate(fixDate.value)}</b></small></li></ul></div>` +
        `<p class="qc-note">The change is written to the activity log and the child's risk is re-assessed.</p>`;
      if (!await askConfirm('Confirm date correction', html, 'Confirm, change date')) return;
      const r = await post('quick-fix-date', id, { code: fixCode, date: fixDate.value });
      fix.querySelectorAll('.qp-msg').forEach(m => m.remove());
      if (!r.ok) { fix.insertAdjacentHTML('beforeend', `<div class="qp-msg err" style="flex-basis:100%"></div>`); fix.lastElementChild.textContent = r.error; return; }
      updateRow(tr, r.row);
      if (!r.unchanged) toast(`<div class="row1"><span>Date corrected. Now <b>${r.risk}</b>.</span></div>`);
      closePanel(); openPanel(tr);
    });

    // guardian details
    const view = panel.querySelector('.qp-info-view'), form = panel.querySelector('.qp-info-form');
    panel.querySelector('.qp-info-edit').addEventListener('click', () => { view.hidden = true; form.hidden = false; form.querySelector('input').focus(); });
    panel.querySelector('.qp-info-cancel').addEventListener('click', () => { form.hidden = true; view.hidden = false; });
    panel.querySelector('.qp-info-save').addEventListener('click', async () => {
      const data = {};
      form.querySelectorAll('input').forEach(i => { data[i.name] = i.value.trim(); });
      const old = { guardian_name: view.querySelector('.qp-g').textContent, guardian_contact: view.querySelector('.qp-p').textContent, address: view.querySelector('.qp-a').textContent };
      const labels = { guardian_name: 'Guardian', guardian_contact: 'Contact number', address: 'Address' };
      const diffs = Object.keys(labels).filter(k => (data[k] || '—') !== old[k]);
      if (!diffs.length) { form.hidden = true; view.hidden = false; return; }
      const html = whoHtml(tr) + `<div class="qc-sec"><div class="qc-lbl">Changes</div><ul class="qc-list">` +
        diffs.map(k => `<li><span>${labels[k]}</span><small>${esc(old[k])}<span class="qc-arrow">to</span><b style="color:var(--text-primary)">${esc(data[k] || '—')}</b></small></li>`).join('') +
        `</ul></div>`;
      if (!await askConfirm('Confirm guardian details', html, 'Confirm, save changes')) return;
      const r = await post('quick-info', id, data);
      form.querySelectorAll('.qp-msg').forEach(m => m.remove());
      if (!r.ok) { form.insertAdjacentHTML('beforeend', '<div class="qp-msg err" style="flex-basis:100%"></div>'); form.lastElementChild.textContent = r.error; return; }
      view.querySelector('.qp-g').textContent = r.guardian_name;
      view.querySelector('.qp-p').textContent = r.guardian_contact;
      view.querySelector('.qp-a').textContent = r.address;
      form.hidden = true; view.hidden = false;
      toast('<div class="row1"><span>Guardian details saved</span></div>');
    });

    refresh();
  }

  // open/close by clicking a row (links keep working), Enter/Space, arrow keys
  table.addEventListener('click', e => {
    const tr = e.target.closest('tbody tr[data-child-id]');
    if (!tr || e.target.closest('a, button, input, label, select')) return;
    openPanel(tr);
  });
  table.addEventListener('keydown', e => {
    const tr = e.target.closest && e.target.closest('tbody tr[data-child-id]');
    if (!tr || e.target !== tr) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(tr); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const all = rows(), i = all.indexOf(tr) + (e.key === 'ArrowDown' ? 1 : -1);
      if (all[i]) all[i].focus();
    }
  });
  window.addEventListener('resize', () => {
    if (!openRow) return;
    const h = openRow.nextElementSibling && openRow.nextElementSibling.querySelector('.qp-holder');
    if (h) sizeHolder(openRow, h);
  });

  const auto = new URLSearchParams(location.search).get('open');
  if (auto) {
    const tr = table.querySelector(`tbody tr[data-child-id="${auto}"]`);
    if (tr) { openPanel(tr, true); tr.scrollIntoView({ block: 'center' }); }
  }
})();
</script>
